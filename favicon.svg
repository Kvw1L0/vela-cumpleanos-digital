<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="flameGrad" cx="50%" cy="75%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffff00"/>
      <stop offset="60%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ff3300" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="32" cy="22" r="16" fill="#ff8c00" opacity="0.3" filter="url(#glow)"/>
  <!-- Candle Body -->
  <rect x="22" y="32" width="20" height="28" rx="3" fill="#e63946"/>
  <ellipse cx="32" cy="32" rx="10" ry="2.5" fill="#ffd166"/>
  <!-- Wick -->
  <line x1="32" y1="32" x2="32" y2="24" stroke="#2b1d0c" stroke-width="2" stroke-linecap="round"/>
  <!-- Flame -->
  <path d="M 32 8 C 30 14, 25 18, 25 24 C 25 28, 28 30, 32 30 C 36 30, 39 28, 39 24 C 39 18, 34 14, 32 8 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <ellipse cx="32" cy="26" rx="2.5" ry="4" fill="#ffffff" opacity="0.9"/>
</svg>
