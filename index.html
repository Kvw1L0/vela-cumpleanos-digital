<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vela de Cumpleaños Digital | Experiencia BTL Interactiva</title>
  
  <!-- Icono y Metadatos para Móviles y PWA -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#08070d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Vela de cumpleaños digital y multijugador interactiva para activaciones BTL y eventos en vivo.">

  <!-- Tipografía moderna del branding (Poppins, Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Estilos principales -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========================================================
       MODAL DE BIENVENIDA / SOLICITUD DE PERMISOS DE AUDIO
       Requerimiento estricto: Interacción del usuario requerida
       por navegadores móviles (iOS Safari / Chrome) para desbloquear
       el AudioContext y solicitar permisos del micrófono.
       ======================================================== -->
  <div id="welcome-modal" class="modal-overlay active">
    <div class="modal-card welcome-card">
      <div class="modal-brand-header">
        <img src="logo-hdc.png" alt="Hogar de Cristo" class="brand-logo-img">
      </div>
      <h1 class="modal-title">CELEBREMOS JUNTOS</h1>
      <p class="modal-subtitle">
        Conéctate con todos los asistentes para apagar las velas de los 82 años soplando al micrófono de tu teléfono.
      </p>

      <button id="btn-join" class="btn-primary" aria-label="Unirse a la celebración">
        <span class="btn-glow"></span>
        <span class="btn-content">UNIRSE A LA CELEBRACIÓN</span>
      </button>
    </div>
  </div>

  <!-- ========================================================
       ESCENARIO PRINCIPAL (Vela y Glow ambiental cinematográfico)
       ======================================================== -->
  <main id="app-container" class="app-container">
    
    <!-- Resplandor ambiental de fondo sincronizado con la vela -->
    <div id="ambient-glow" class="ambient-glow"></div>

    <!-- Escenario Central de la Torta de Cumpleaños -->
    <section class="candle-stage" aria-label="Torta de cumpleaños interactiva">
      
      <!-- Contenedor de la Torta y Llamas Virtuales -->
      <div id="cake-wrapper" class="cake-wrapper">
        <img src="torta.png" alt="Torta 82 años Aniversario 2026" class="cake-image" id="cake-image">
        
        <!-- LLAMA VIRTUAL 1: Sobre la vela del número '8' -->
        <div class="flame-anchor flame-8">
          <div class="smoke-container smoke-8">
            <div class="smoke-particle p1"></div>
            <div class="smoke-particle p2"></div>
            <div class="smoke-particle p3"></div>
          </div>
          <div class="candle-flame flame-left" aria-hidden="true">
            <div class="flame-inner-white"></div>
            <div class="flame-inner-blue"></div>
          </div>
          <div class="candle-wick">
            <div class="wick-ember"></div>
          </div>
        </div>

        <!-- LLAMA VIRTUAL 2: Sobre la vela del número '2' -->
        <div class="flame-anchor flame-2">
          <div class="smoke-container smoke-2">
            <div class="smoke-particle p1"></div>
            <div class="smoke-particle p2"></div>
            <div class="smoke-particle p3"></div>
          </div>
          <div class="candle-flame flame-right" aria-hidden="true">
            <div class="flame-inner-white"></div>
            <div class="flame-inner-blue"></div>
          </div>
          <div class="candle-wick">
            <div class="wick-ember"></div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- ========================================================
       MODAL FINAL: AGRADECIMIENTO Y CIERRE AUTOMÁTICO (10s)
       Easter Egg: Tocar el logo antes de 10s reinicia la vela
       ======================================================== -->
  <div id="victory-modal" class="modal-overlay victory-overlay">
    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>
    <div class="modal-card victory-card">
      <div class="modal-brand-header easter-egg-trigger" id="victory-logo-trigger" title="Hogar de Cristo">
        <img src="logo-hdc.png" alt="Hogar de Cristo" class="brand-logo-img">
      </div>
      <h2 class="victory-title">Muchas gracias por formar parte de esto</h2>
    </div>
  </div>

  <!-- Notificación flotante para alertas / aviso de credenciales -->
  <div id="toast-notification" class="toast-notification" aria-live="polite"></div>

  <!-- ========================================================
       LÓGICA DE LA APLICACIÓN (Módulo Vanilla JavaScript)
       Utiliza importación nativa moderna ES Modules de Firebase vía CDN
       ======================================================== -->
  <script type="module" src="app.js"></script>
</body>
</html>
